seed:
  random_seed: 42

source:
  note: "SOTA V4 Ultimate MSDA Residual Config: Mask-Free ConvNeXt-B MS1M with Stage 2 Micro-Texture Bridge, 4-Branch Dilation (1,2,4), LayerNorm Spatial Attention, Full Backbone Fine-tuning (Unfrozen Stage 1-4), Initial Alpha 0.05, SupCon Loss, Aux Supervision Head, and SAM Optimizer."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 32
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: true

tta:
  enabled: true
  hflip: true
  original_weight: 0.5
  flip_weight: 0.5

data:
  data_path: "data/fer13-split"
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: true
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5
  gamma_min: 0.5
  gamma_max: 2.0
  random_erasing_prob: 0.40
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.15
  random_erasing_value: "random"

model:
  name: "convnext_base_ms1m_crossstage_msda_residual_v4_sota"
  arch: "convnext_base_ms1m_crossstage_msda_residual"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: false
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001
  classifier_dropout: 0.35

  # SOTA V4 Advanced Supervision & Micro-Texture Bridge Architecture
  freeze_stage12: false                         # Unfreeze Stage 1 & Stage 2 after 4 warmup epochs for max adaptation
  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  
  use_aux_loss: true                            # Deep Supervision Aux Classifier Head on Stage 4
  aux_loss_weight: 0.20
  
  use_supcon_loss: true                         # Supervised Contrastive Loss on F_da Features
  supcon_loss_weight: 0.10
  supcon_temperature: 0.10

cross_stage_msda:
  branch_dim: 256
  channel_reduction: 16
  spatial_kernel_size: 7
  alpha_max: 0.20
  initial_alpha: 0.05

training:
  epochs: 60
  patience: 15
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.03
  sam_adaptive: false
  lr: 0.0003
  finetune_lr: 0.0003
  visual_extractor_lr: 0.00003
  weight_decay: 0.035
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100

paths:
  output_dir: "outputs/tf_runs/convnext_base_ms1m_crossstage_msda_residual_v4_sota"
  logs_dir: "logs"

smoke_tests:
  identity_max_abs_logit_diff: 0.0001
  max_new_module_params: 6500000
  max_total_params: 95000000
