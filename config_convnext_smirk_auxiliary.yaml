seed:
  random_seed: 42

source:
  note: "ConvNeXt-Base FER with SMIRK/FLAME 3D Expression Auxiliary Supervision"

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 32
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 8
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: true
  prefetch_buffer: 2
  distributed_eval: false

data:
  data_path: "data/fer13-split"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: true
  use_clean_filter: false
  bad_row_indices_path: null
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: false
  rotation_degrees: 0.0
  brightness_delta: 0.0
  contrast_lower: 1.0
  contrast_upper: 1.0
  gamma_prob: 0.0
  random_erasing_prob: 0.0

rgb_backbone:
  name: "convnext_base_ms1m_arcface_baseline"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001
  classifier_dropout1: 0.35
  ablation: "cnn_only"

smirk:
  smirk_root: "external/smirk"
  checkpoint: "external/smirk/pretrained_models/SMIRK_em1.pt"
  device: "cuda"
  image_size: 224
  crop: true
  crop_scale: 1.4
  mediapipe_input_size: 224
  on_crop_failure: "resize"
  strict_load: true
  init_timm_pretrained: false

model:
  name: "convnext_smirk_auxiliary"
  ablation: "exp_jaw_head" # ('baseline', 'exp', 'exp_jaw', 'exp_jaw_head')
  dropout: 0.35

auxiliary:
  lambda_geo: 0.5
  loss_type: "smooth_l1"
  huber_delta: 1.0

training:
  epochs: 80
  patience: 15
  optimizer: "adamw"
  lr: 0.0001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.01
  grad_clip_norm: 1.0

baseline_checkpoint:
  best_checkpoint_dir: "outputs/tf_runs/convnext_base_ms1m_arcface_baseline/checkpoints/best"
  require: true

paths:
  output_dir: "outputs/convnext_smirk_auxiliary"
  auxiliary_target_dir: "outputs/smirk_auxiliary/3d_targets"
