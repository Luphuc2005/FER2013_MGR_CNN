seed:
  random_seed: 42

source:
  pytorch_config: "configs/version_best_reproduce/reproduce_7512_mask_guided_7462_learned_only_drop345_seed42_kaggle.yaml"
  reported_tta_hflip_accuracy_percent: 75.2020
  note: "MGR-CNN 75%+ Optimized config: Attention-only logit decision path, Ortho Loss 0.005, visual_extractor_lr 2e-6, drop345 clean filter."

runtime:
  gpu_ids: [0, 1]
  batch_size_per_gpu: 8
  fallback_batch_size_per_gpu: 8
  require_two_gpus: true
  min_gpus: 2
  memory_growth: true
  intra_op_threads: 2
  inter_op_threads: 2
  tf_data_num_parallel_calls: 2
  tf_data_private_threadpool_size: 2
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: true
  eval_tta_hflip: true
  train_val_tta_hflip: true

data:
  data_path: "/kaggle/input/datasets/doduyquynii/fer13-split"
  mask_dir: "/kaggle/input/datasets/lhongphuc2/mediapipe-mask-datasets-35887"
  num_classes: 7
  image_size: 224
  channels: 3
  normalize: true
  predecode_pixels: true
  preload_masks: true
  allow_missing_masks: false
  use_clean_filter: true
  bad_row_indices_path: "/kaggle/input/datasets/lhngphc/345-train-error/bad_row_indices_drop345_mediapipe_failed.txt"
  mask_ablation: "none"
  mask_region_permutation: [4, 2, 0, 5, 1, 3]
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5

model:
  name: "mgr_convnext_fer"
  pretrained: true
  use_builtin_convnext: true
  builtin_include_preprocessing: false
  weights: "imagenet"
  checkpoint_path: null
  checkpoint_strict: false
  num_regions: 6
  token_grid_size: 7
  visual_dim: 768
  embed_dim: 384
  num_heads: 4
  num_encoder_layers: 2
  transformer_dropout: 0.25
  use_visual_pos_embed: true
  use_region_slot_embed: true
  use_global_visual_bias: true
  region_pooling: "concat"
  classifier_hidden_dim: 512
  classifier_dropout1: 0.50
  classifier_dropout2: 0.35
  ortho_loss_type: "squared_offdiag"
  ortho_loss_weight: 0.005
  use_source_classifier: false
  use_clip_dictionary: false
  use_learnable_clip_region_tokens: false
  mask_guided_attention: true
  mask_attention_alpha: 0.3
  mask_floor: 0.05
  mask_ablation: "none"
  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_pooling: "avg"
  cnn_aux_loss_weight: 0.0
  cnn_aux_hidden_dim: 768
  cnn_aux_dropout: 0.25
  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "attention"
  finetune_logit_fusion: "attention"
  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true
  use_region_relation_tokens: true
  region_relation_dropout: 0.1
  region_relation_pairs:
    - name: "brow_eye"
      left: [0]
      right: [1, 2]
    - name: "eye_nose"
      left: [1, 2]
      right: [3]
    - name: "nose_mouth"
      left: [3]
      right: [4]
    - name: "eyes_mouth"
      left: [1, 2]
      right: [4]
  ablation: "full"

training:
  epochs: 60
  patience: 15
  loss: "cross_entropy"
  label_smoothing: 0.05
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.03
  sam_adaptive: false
  lr: 0.00008
  finetune_lr: 0.00004
  visual_extractor_lr: 0.000002
  weight_decay: 0.02
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 20
  progress_interval: 200

paths:
  output_dir: "/kaggle/working/outputs/tf_runs/mgrcnn_75plus_optimized_2gpu"
  logs_dir: "/kaggle/working/logs"
