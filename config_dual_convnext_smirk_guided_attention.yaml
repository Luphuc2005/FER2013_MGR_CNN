# Configuration for Stage 1 frozen ConvNeXt-B MS1M + FER ckpt-43 RGB anchor
# with small SMIRK depth+normal CNN geometry-guided channel attention.

seed: 42

runtime:
  use_mixed_precision: true

data:
  num_classes: 7
  image_size: 112
  batch_size: 32
  data_path: "data/fer13-split"
  use_clean_filter: false
  predecode_pixels: true

rgb_backbone:
  name: "convnext_base_ms1m_arcface_baseline"
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  baseline_checkpoint_path: "outputs/tf_runs/convnext_base_ms1m_arcface_baseline/checkpoints/best/ckpt-43"
  classifier_dropout1: 0.35
  ablation: "cnn_only"

geometry_cache:
  feature_dir: "outputs/stage1_rgb_smirk_3d_cnn_late_fusion/geometry_maps"
  map_file_pattern: "{split}_smirk_depth_normal_maps.npz"
  dtype: "float16"

model:
  name: "dual_convnext_smirk_guided_attention"
  feature_dim: 1024
  geometry_width: 64
  attention_hidden_dim: 256
  alpha_max: 0.2
  alpha_raw_init: -4.6

training:
  epochs: 60
  patience: 15
  use_sam: false
  sam_rho: 0.0
  label_smoothing: 0.10
  optimizer: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.035
  grad_clip_norm: 1.0
  monitor: "val_accuracy"
  best_checkpoint_start_epoch: 1
  progress_interval: 100

paths:
  output_dir: "outputs/dual_convnext_smirk_guided_attention"
