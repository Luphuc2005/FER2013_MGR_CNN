seed:
  random_seed: 42

source:
  note: "RAF-DB V10 Dual-Minority SOTA 93%: Dual Class-Aware Augmented Oversampling for Fear (253 -> 500) AND Disgust (645 -> 850) + Native 112x112 ArcFace Receptive Field + Direct Global-Regional Fusion (1024-dim) + Stage 3 Dynamic Part Attention + Stage 4 Adaptive Semantic Logit Fusion Gate alpha(x) <= 0.10 + Anti-Collapse Gate Floor (T_end=1.6) + Late-Stage Semantic Decay (0.08 -> 0.01) + Tamer Backbone LR (5e-6) + Enhanced DropPath (0.35) + SAM (rho=0.02) + No-TTA Validation + Validation-Tuned TTA Sweep."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 16
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 8
  tf_data_private_threadpool_size: 8
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: false

tta:
  enabled: true
  hflip: true
  original_weight: 0.50
  flip_weight: 0.50

data:
  data_path: "data/rafdb"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: false
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 12723
  cache: false

  # Dual Minority Class-Aware Augmented Oversampling:
  # Class 1 (Disgust): 645 -> 850 (+205 augmented samples)
  # Class 2 (Fear):    253 -> 500 (+247 augmented samples)
  sampling_strategy: "class_aware_minority_oversample"
  minority_classes: [1, 2]
  target_minority_count: 500
  target_minority_counts:
    1: 850
    2: 500
  minority_aug:
    flip_prob: 0.50
    rotation_range: 10.0
    translation_fraction: 0.04
    scale_lower: 0.92
    scale_upper: 1.08
    brightness_delta: 0.18
    contrast_lower: 0.85
    contrast_upper: 1.15

augmentation:
  horizontal_flip: true
  rotation_degrees: 10.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.50
  gamma_min: 0.70
  gamma_max: 1.30
  random_erasing_prob: 0.35
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.15
  random_erasing_value: "random"

model:
  name: "rafdb_v10_dual_minority_sota_93"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  checkpoint_path: null
  checkpoint_strict: false
  drop_path_rate: 0.35
  layer_scale_init_value: 0.000001
  embed_dim: 512
  num_regions: 6
  num_heads: 4

  # Direct Global-Regional Fusion (1024-dim: Global ConvNeXt 256 + Part-Aware Attention Upper 256, Lower 256, AU 256)
  use_dynamic_part_attention: true
  dynamic_part_bottleneck: 128
  use_soft_regional_pooling: false
  use_global_regional_fusion: true
  global_regional_projection_dim: 256
  use_multistage_adaptive_fusion: false
  use_eca: false
  use_stage3_eca: false

  # Stage 4 Adaptive Semantic Logit Fusion Gate alpha(x)
  use_adaptive_fusion_gate: true
  adaptive_fusion_max_alpha: 0.10
  semantic_fusion_alpha: 0.0
  semantic_fusion_training: false

  # Sample-Adaptive Multi-Granularity SigLIP2 Semantics with Anti-Collapse Gate Floor
  use_adaptive_granularity: true
  granularity_gate_schedule:
    enabled: true
    uniform_epochs: 4
    transition_end_epoch: 15
    start_temperature: 2.5
    end_temperature: 1.6

  use_semantic_branch: true
  use_clip_semantic: true
  multi_prototype: true
  ablation: "adaptive_clip_confusion"
  lambda_local_sem: 0.02
  lambda_sem: 0.08
  use_hard_semantic_loss: true
  lambda_hard: 0.05
  hard_margin: 0.18
  hard_pairs:
    0: [1, 4]
    1: [4, 0, 6]
    2: [5, 4, 0]
    4: [6, 1]
    5: [2]
    6: [4, 1]
  clip_model_name: "google/siglip2-base-patch16-224"
  clip_embedding_dim: 768
  clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
  semantic_logit_scale: 20.0
  clip_semantic:
    enabled: true
    multi_prototype: true
    num_prototypes_per_class: 5
    clip_model_name: "google/siglip2-base-patch16-224"
    clip_embedding_dim: 768
    clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
    semantic_logit_scale: 20.0
    lambda_sem: 0.08
    lambda_hard: 0.05
    hard_margin: 0.18
    lambda_local_sem: 0.02
    use_adaptive_fusion_gate: true
    adaptive_fusion_max_alpha: 0.10

  semantic_projector_dropout: 0.15
  classifier_dropout1: 0.40
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0
  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0
  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  # Clean unfreeze at Epoch 5
  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true
  progressive_unfreeze:
    enabled: false

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 40
  patience: 16
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  logit_adjustment:
    enabled: false
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.02
  sam_adaptive: false
  lr: 0.00028
  finetune_lr: 0.00028
  visual_extractor_lr: 0.000005
  weight_decay: 0.05
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  save_best_macro_f1: true
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100
  lambda_sem_schedule:
    enabled: true
    start_epoch: 12
    end_epoch: 28
    start_value: 0.08
    end_value: 0.01
    before_value: 0.08
    after_value: 0.01

paths:
  output_dir: "outputs/papers/rafdb_v10_dual_minority_sota_93"
  logs_dir: "logs"
  auto_increment: false