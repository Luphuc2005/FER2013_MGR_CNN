seed:
  random_seed: 42

source:
  note: "Stage 2A: SMIRK Expression-Neutral Delta-Mesh 3D-Only FER Probe. No RGB fusion. FLAME geometry deformation probe for 7 FER2013 emotions."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 128
  fallback_batch_size_per_gpu: 64
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: false
  intra_op_threads: 8
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: true
  prefetch_buffer: 2

data:
  data_path: "data/fer13-split"
  num_classes: 7
  image_size: 224
  channels: 3
  use_clean_filter: false
  bad_row_indices_path: null

smirk:
  smirk_root: "external/smirk"
  checkpoint: "external/smirk/pretrained_models/SMIRK_em1.pt"
  device: "cuda"
  extract_batch_size: 128
  image_size: 224
  crop: true
  crop_scale: 1.4
  mediapipe_input_size: 224
  on_crop_failure: "resize"

model:
  name: "stage2a_smirk_delta_mesh_gnn"
  arch: "2layer_gcn_gat_probe"
  num_classes: 7
  num_regions: 12
  region_feature_dim: 10
  node_proj_dim: 128
  gcn_hidden_dim: 128
  fc_geometry_dim: 512
  dropout: 0.20
  l2_weight_decay: 0.0001
  use_sam: false

training:
  epochs: 100
  patience: 20
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.0
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  tie_break_metric: "val_macro_f1"

paths:
  output_dir: "outputs/stage2a_smirk_delta_mesh_probe"
  cache_dir: "outputs/stage2a_smirk_delta_mesh_probe/cache"
  logs_dir: "outputs/stage2a_smirk_delta_mesh_probe/logs"
  checkpoints_dir: "outputs/stage2a_smirk_delta_mesh_probe/checkpoints"
  vis_dir: "outputs/stage2a_smirk_delta_mesh_probe/visualizations"
