seed:
  random_seed: 42

source:
  note: "RAF-DB v5 Combined Ultimate + Class-Aware Stochastic Augmented Minority Oversampling (1200 target for Angry, Disgust, Fear, Surprise; Train-only; Total=13150)."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 16
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: false

tta:
  enabled: true
  hflip: true
  original_weight: 0.50
  flip_weight: 0.50

data:
  data_path: "data/rafdb"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: false
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 13150
  cache: false
  # Class-aware stochastic augmented minority oversampling (train only)
  sampling_strategy: "class_aware_minority_oversample"
  target_minority_count: 650
  minority_classes: [0, 1, 2]
  minority_aug:
    flip_prob: 0.50
    rotation_range: 10.0
    brightness_delta: 0.20
    contrast_lower: 0.80
    contrast_upper: 1.20
    scale_lower: 0.90
    scale_upper: 1.10
    translation_fraction: 0.05

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5
  gamma_min: 0.5
  gamma_max: 2.0
  random_erasing_prob: 0.40
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.15
  random_erasing_value: "random"

model:
  name: "rafdb_v5_combined_ultimate_oversampled"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.25
  layer_scale_init_value: 0.000001
  embed_dim: 512
  num_regions: 6
  num_heads: 4

  use_semantic_branch: true
  use_clip_semantic: true
  multi_prototype: true
  ablation: "adaptive_clip_confusion"

  # CẢI TIẾN 1: Dynamic Part-Aware Attention (Stage 3)
  use_dynamic_part_attention: true
  dynamic_part_bottleneck: 128
  use_soft_regional_pooling: false

  # CẢI TIẾN 2: Sample-Adaptive Logit Fusion Gate alpha(x) (Stage 4)
  use_adaptive_fusion_gate: true
  adaptive_fusion_max_alpha: 0.10

  # Sample-adaptive granularity weighting across 5 prototypes with Anti-Collapse Schedule
  use_adaptive_granularity: true
  granularity_gate_schedule:
    enabled: true
    step_schedule: true
    uniform_epochs: 4
  granularity_gate_step_schedule: true
  granularity_gate_uniform_epochs: 4
  granularity_gate_temperature_steps:
    - [4, 1.0]
    - [10, 2.0]
    - [20, 1.5]
    - [999, 1.0]
  lambda_gate_entropy: 0.01
  gate_entropy_floor: 0.80

  use_hard_semantic_loss: true
  lambda_sem: 0.05
  lambda_hard: 0.05
  hard_margin: 0.15
  hard_pairs:
    0: [1, 4]
    1: [4, 0, 6, 3]
    2: [5, 4, 0]
    4: [6, 1]
    5: [2]
    6: [4, 1]

  clip_model_name: "google/siglip2-base-patch16-224"
  clip_embedding_dim: 768
  clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
  semantic_logit_scale: 20.0

  clip_semantic:
    enabled: true
    multi_prototype: true
    num_prototypes_per_class: 5
    clip_model_name: "google/siglip2-base-patch16-224"
    clip_embedding_dim: 768
    clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
    semantic_logit_scale: 20.0
    lambda_sem: 0.05
    lambda_hard: 0.05
    hard_margin: 0.15

  checkpoint_path: null
  checkpoint_strict: false
  semantic_projector_dropout: 0.10
  classifier_dropout1: 0.40
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0

  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0

  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 60
  patience: 20
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.02
  sam_adaptive: false
  lr: 0.0003
  finetune_lr: 0.0003
  visual_extractor_lr: 0.000005
  weight_decay: 0.05
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100
  # Semantic loss kept stable at 0.05 to prevent explosion
  lambda_sem_schedule:
    enabled: false

paths:
  output_dir: "outputs/papers/rafdb_v5_combined_ultimate_oversampled"
  logs_dir: "logs"
