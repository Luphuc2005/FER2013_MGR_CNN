seed:
  random_seed: 42

source:
  note: "RAF-DB V6 Anti-Overfitting: Progressive unfreezing, lower backbone LR, label_smoothing=0.05, weight_decay=0.05. Based on v5 Combined Ultimate SOTA + Logit Adjustment."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 16
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: false

tta:
  enabled: true
  hflip: true
  original_weight: 0.50
  flip_weight: 0.50

data:
  data_path: "data/rafdb"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: false
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 12271
  cache: false

augmentation:
  horizontal_flip: true
  rotation_degrees: 5.0
  brightness_delta: 0.10
  contrast_lower: 0.90
  contrast_upper: 1.10
  gamma_prob: 0.3
  gamma_min: 0.8
  gamma_max: 1.2
  random_erasing_prob: 0.15
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.08
  random_erasing_value: "random"

model:
  name: "rafdb_v6_anti_overfitting"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.10
  layer_scale_init_value: 0.000001
  embed_dim: 512
  num_regions: 6
  num_heads: 4

  use_semantic_branch: true
  use_clip_semantic: true
  multi_prototype: true
  ablation: "adaptive_clip_confusion"

  # Dynamic Part-Aware Attention (Stage 3)
  use_dynamic_part_attention: true
  dynamic_part_bottleneck: 128
  use_soft_regional_pooling: false

  # Sample-Adaptive Logit Fusion Gate alpha(x) (Stage 4)
  use_adaptive_fusion_gate: true
  adaptive_fusion_max_alpha: 0.20

  # Sample-adaptive granularity weighting across 5 prototypes
  use_adaptive_granularity: true

  use_hard_semantic_loss: true
  lambda_sem: 0.10
  lambda_hard: 0.05
  hard_margin: 0.15
  hard_pairs:
    0: [1, 4]        # angry -> disgust, sad
    1: [4, 0, 6]     # disgust -> sad, angry, neutral
    2: [5, 4, 0]     # fear -> surprise, sad, angry
    4: [6, 1]        # sad -> neutral, disgust
    5: [2]           # surprise -> fear
    6: [4, 1]        # neutral -> sad, disgust

  clip_model_name: "google/siglip2-base-patch16-224"
  clip_embedding_dim: 768
  clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
  semantic_logit_scale: 20.0

  clip_semantic:
    enabled: true
    multi_prototype: true
    num_prototypes_per_class: 5
    clip_model_name: "google/siglip2-base-patch16-224"
    clip_embedding_dim: 768
    clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
    semantic_logit_scale: 20.0
    lambda_sem: 0.10
    lambda_hard: 0.05
    hard_margin: 0.15

  checkpoint_path: null
  checkpoint_strict: false
  semantic_projector_dropout: 0.10
  classifier_dropout1: 0.35
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0

  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0

  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  # V6: Progressive unfreezing replaces simple freeze_backbone_epochs
  freeze_backbone_epochs: 0
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true

  # V6: Progressive unfreezing schedule
  progressive_unfreeze:
    enabled: true
    schedule:
      # Epoch 1-8: freeze entire backbone, train head only
      - start_epoch: 1
        end_epoch: 8
        trainable_stages: []
      # Epoch 9-15: unfreeze stage4 + downsample_stage4 only
      - start_epoch: 9
        end_epoch: 15
        trainable_stages: [4]
      # Epoch 16+: unfreeze stage3 + downsample_stage3 + stage4 + downsample_stage4
      - start_epoch: 16
        end_epoch: 999
        trainable_stages: [3, 4]
    # Per-stage LR multipliers relative to visual_extractor_lr
    stage_lr_multipliers:
      "4": 1.0    # stage4 gets full visual_extractor_lr = 1e-5
      "3": 0.5    # stage3 gets 0.5 * visual_extractor_lr = 5e-6

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 60
  patience: 20
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.05

  # Logit Adjustment (ICLR 2021)
  logit_adjustment:
    enabled: true
    tau: 0.5

  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.02
  sam_adaptive: false
  lr: 0.0003
  finetune_lr: 0.0003
  visual_extractor_lr: 0.00001
  weight_decay: 0.05
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100
  lambda_sem_schedule:
    enabled: true
    before_value: 0.10
    start_epoch: 5
    end_epoch: 10
    start_value: 0.10
    end_value: 0.15
    after_value: 0.15

  # V6: Always save best macro-F1 checkpoint
  save_best_macro_f1: true

paths:
  output_dir: "outputs/papers/rafdb_v6_anti_overfitting"
  logs_dir: "logs"
