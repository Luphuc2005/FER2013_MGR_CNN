seed:
  random_seed: 42

source:
  note: "ConvNeXt-B MS1M Multi-Scale Region Gated Fusion for FER2013."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 32
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: false
  train_val_tta_hflip: false

data:
  data_path: "data/fer13-split"
  mask_dir: "data/mediapipe_region_masks"
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: true
  preload_masks: false
  allow_missing_masks: false
  use_clean_filter: true
  bad_row_indices_path: "data/bad_row_indices_drop345_mediapipe_failed.txt"
  mask_ablation: "none"
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5
  gamma_min: 0.5
  gamma_max: 2.0
  random_erasing_prob: 0.40
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.15
  random_erasing_value: "random"

model:
  name: "convnext_base_ms1m_region_gated_fusion"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: false
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001

  checkpoint_path: null
  checkpoint_strict: false

  # Multi-Scale Region Gated Fusion Architecture Settings
  multi_scale_mgr: true
  stage3_token_grid_size: 14
  stage4_token_grid_size: 7
  num_regions: 6
  embed_dim: 256
  num_heads: 4
  num_encoder_layers: 1
  transformer_dropout: 0.10
  classifier_dropout: 0.20
  mask_attention_alpha: 0.3
  mask_floor: 0.05

  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true
  ablation: "full"

training:
  epochs: 60
  patience: 15
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  optimizer: "adamw"
  base_optimizer: "adamw"
  lr: 0.0001
  finetune_lr: 0.0001
  visual_extractor_lr: 0.00001
  weight_decay: 0.035
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100

paths:
  output_dir: "outputs/tf_runs/convnext_base_ms1m_region_gated_fusion"
  logs_dir: "logs"
