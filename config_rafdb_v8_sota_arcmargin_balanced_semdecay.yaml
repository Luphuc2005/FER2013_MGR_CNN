seed:
  random_seed: 42

source:
  note: "RAF-DB V8 SOTA Candidate: V5 Combined Ultimate baseline with Direct LGSA Fusion, ArcMargin classifier, Class-Aware Stochastic Augmented Oversampling (train-only), SigLIP2 Piecewise Semantic Decay, Anti-Collapse Gate Entropy Floor, and 4-Phase Progressive Unfreezing."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 16
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: false

tta:
  enabled: true
  hflip: true
  original_weight: 0.50
  flip_weight: 0.50

data:
  data_path: "data/rafdb"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: false
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 13150
  cache: false
  # Class-aware stochastic augmented minority oversampling (train only)
  sampling_strategy: "class_aware_minority_oversample"
  target_minority_count: 1200
  minority_classes: [0, 1, 2, 5]
  minority_aug:
    flip_prob: 0.50
    rotation_range: 10.0
    brightness_delta: 0.20
    contrast_lower: 0.80
    contrast_upper: 1.20
    scale_lower: 0.90
    scale_upper: 1.10
    translation_fraction: 0.05

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5
  gamma_min: 0.5
  gamma_max: 2.0
  random_erasing_prob: 0.40
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.10
  random_erasing_value: "random"

model:
  name: "rafdb_v8_sota_arcmargin_balanced_semdecay"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  checkpoint_path: null
  checkpoint_strict: false
  drop_path_rate: 0.10
  layer_scale_init_value: 0.000001
  embed_dim: 512
  num_regions: 6
  num_heads: 4

  # Direct Global-Regional Fusion (1024-dim)
  use_dynamic_part_attention: true
  dynamic_part_bottleneck: 128
  use_soft_regional_pooling: false
  use_global_regional_fusion: true
  global_regional_projection_dim: 256
  use_multistage_adaptive_fusion: false
  use_eca: false
  use_stage3_eca: false
  use_adaptive_fusion_gate: false
  semantic_fusion_alpha: 0.0
  semantic_fusion_training: false

  # FER Classifier: ArcMarginProduct
  classifier_type: "arcmargin"
  arcmargin_scale: 30.0
  arcmargin_margin: 0.30
  arcmargin_easy_margin: false

  # Anti-collapse Granularity Gate Schedule
  use_adaptive_granularity: true
  granularity_gate_step_schedule: true
  granularity_gate_uniform_epochs: 4
  granularity_gate_temperature_steps:
    - [4, 1.0]
    - [10, 2.0]
    - [20, 1.5]
    - [999, 1.0]
  lambda_gate_entropy: 0.01
  gate_entropy_floor: 0.80

  # SigLIP2 Multi-Prototype Semantics
  use_semantic_branch: true
  use_clip_semantic: true
  multi_prototype: true
  ablation: "adaptive_clip_confusion"
  lambda_local_sem: 0.02
  lambda_sem: 0.10
  use_hard_semantic_loss: true
  lambda_hard: 0.05
  hard_margin: 0.15
  hard_pairs:
    0: [1, 4]
    1: [4, 0, 6]
    2: [5, 4, 0]
    4: [6, 1]
    5: [2]
    6: [4, 1]
  clip_model_name: "google/siglip2-base-patch16-224"
  clip_embedding_dim: 768
  clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
  semantic_logit_scale: 20.0
  clip_semantic:
    enabled: true
    multi_prototype: true
    num_prototypes_per_class: 5
    clip_model_name: "google/siglip2-base-patch16-224"
    clip_embedding_dim: 768
    clip_prototypes_path: "pretrained/siglip2_text_prototypes_7emotions_multigranularity_multi5.npy"
    semantic_logit_scale: 20.0
    lambda_sem: 0.10
    lambda_hard: 0.05
    hard_margin: 0.15
    lambda_local_sem: 0.02
    semantic_fusion_alpha: 0.0
    semantic_fusion_training: false

  semantic_projector_dropout: 0.20
  classifier_dropout1: 0.40
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0
  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0
  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true

  # 4-Phase Progressive Unfreezing
  progressive_unfreeze:
    enabled: true
    schedule:
      - start_epoch: 1
        end_epoch: 4
        trainable_stages: []
        stage_lr_multipliers: {}
      - start_epoch: 5
        end_epoch: 10
        trainable_stages: [4]
        stage_lr_multipliers:
          "4": 1.0
      - start_epoch: 11
        end_epoch: 20
        trainable_stages: [3, 4]
        stage_lr_multipliers:
          "3": 0.5
          "4": 0.8
      - start_epoch: 21
        end_epoch: 999
        trainable_stages: [1, 2, 3, 4]
        stage_lr_multipliers:
          "1": 0.1
          "2": 0.2
          "3": 0.4
          "4": 0.6

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 60
  patience: 20
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  logit_adjustment:
    enabled: false
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.02
  sam_adaptive: false
  lr: 0.0003
  finetune_lr: 0.0003
  visual_extractor_lr: 0.00001
  min_lr: 0.000001
  head_decay_epochs: 33
  weight_decay: 0.035
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  save_best_macro_f1: true
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100

  # SigLIP2 Piecewise Semantic Decay
  lambda_sem_schedule:
    enabled: true
    decay_steps:
      - [8, 0.10]
      - [16, 0.05]
      - [30, 0.02]
      - [999, 0.01]

paths:
  output_dir: "outputs/papers/rafdb_v8_sota_arcmargin_balanced_semdecay"
  logs_dir: "logs"
  auto_increment: false
