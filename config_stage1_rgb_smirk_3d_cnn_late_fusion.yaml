seed:
  random_seed: 42

source:
  note: "Stage 1 FER2013: frozen ConvNeXt-Base MS1M-ArcFace ckpt-43 RGB baseline + frozen SMIRK/FLAME depth-normal cache + small 3D CNN late fusion."

runtime:
  gpu_ids: [0, 1]
  batch_size_per_gpu: 16
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 8
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: true
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: false
  train_val_tta_hflip: false

tta:
  enabled: false
  hflip: false
  original_weight: 1.0
  flip_weight: 0.0

data:
  data_path: "data/fer13-split"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: true
  use_clean_filter: false
  bad_row_indices_path: null
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: true
  rotation_degrees: 0.0
  brightness_delta: 0.0
  contrast_lower: 1.0
  contrast_upper: 1.0
  gamma_prob: 0.0
  random_erasing_prob: 0.0

rgb_backbone:
  name: "convnext_base_ms1m_arcface_baseline"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: null
  convnext_base_require_pretrained: false
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001
  classifier_dropout1: 0.35
  ablation: "cnn_only"

geometry_cache:
  feature_dir: "outputs/stage1_rgb_smirk_3d_cnn_late_fusion/geometry_maps"
  map_file_pattern: "{split}_smirk_depth_normal_maps.npz"
  dtype: "float16"
  expected_channels: 4
  geometry_input_size: 112

smirk:
  smirk_root: "external/smirk"
  checkpoint: "external/smirk/pretrained_models/SMIRK_em1.pt"
  device: "cuda"
  image_size: 224
  render_batch_size: 32
  crop: true
  crop_scale: 1.4
  mediapipe_input_size: 224
  on_crop_failure: "resize"
  strict_load: true
  init_timm_pretrained: false
  render:
    fixed_cam_scale: 7.0
    use_smirk_cam: false

model:
  name: "stage1_rgb_smirk_3d_cnn_late_fusion"
  arch: "stage1_rgb_smirk_3d_cnn_late_fusion"
  rgb_feature_dim: 1024
  geometry_feature_dim: 512
  geometry_base_width: 48
  geometry_dropout: 0.15
  fusion_dropout: 0.30

training:
  epochs: 60
  patience: 15
  loss: "stage1_late_fusion_ce"
  loss_weight_3d: 0.3
  label_smoothing: 0.0
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  monitor: "val_fused_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  progress_interval: 100

baseline_checkpoint:
  best_checkpoint_dir: "/home/ptbao/projects/FER2013_MGR_CNN/outputs/tf_runs/convnext_base_ms1m_arcface_baseline/checkpoints/best/ckpt-43"
  require: true
  strict_existing_objects_matched: true
  rgb_logit_tolerance: 0.00001

paths:
  output_dir: "outputs/stage1_rgb_smirk_3d_cnn_late_fusion"
  logs_dir: "outputs/stage1_rgb_smirk_3d_cnn_late_fusion/logs"

