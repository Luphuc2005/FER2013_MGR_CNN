seed:
  random_seed: 42

source:
  note: "FER2013 ConvNeXt-Base MS1M-ArcFace stage4 RGB tokens cross-attend to cached frozen SMIRK/FLAME depth+normal CLIP vision geometry tokens."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 32
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 8
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: true
  prefetch_buffer: 2
  distributed_eval: false

data:
  data_path: "data/fer13-split"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: true
  use_clean_filter: false
  bad_row_indices_path: null
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: false
  rotation_degrees: 0.0
  brightness_delta: 0.0
  contrast_lower: 1.0
  contrast_upper: 1.0
  gamma_prob: 0.0
  random_erasing_prob: 0.0

rgb_backbone:
  name: "convnext_base_ms1m_arcface_baseline"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001
  classifier_dropout1: 0.35
  ablation: "cnn_only"

geometry_cache:
  feature_dir: "outputs/smirk_geometry_cross_attention/geometry_tokens"
  token_file_pattern: "{split}_smirk_vlm_geometry_tokens.npz"
  dtype: "float16"
  expected_token_dim: 768
  expected_num_tokens: 98

smirk:
  smirk_root: "external/smirk"
  checkpoint: "external/smirk/pretrained_models/SMIRK_em1.pt"
  device: "cuda"
  image_size: 224
  crop: true
  crop_scale: 1.4
  mediapipe_input_size: 224
  on_crop_failure: "resize"
  strict_load: true
  init_timm_pretrained: false
  render:
    fixed_cam_scale: 7.0
    use_smirk_cam: false

vlm:
  model_name: "openai/clip-vit-base-patch32"
  device: "cuda"
  batch_size: 32
  cache_dtype: "float16"
  token_sources: ["depth", "normal"]
  drop_cls_token: true
  freeze: true

model:
  name: "smirk_geometry_cross_attention"
  arch: "smirk_geometry_cross_attention"
  rgb_token_dim: 1024
  geometry_token_dim: 768
  fusion_dim: 512
  num_heads: 8
  ffn_dim: 1024
  dropout: 0.20
  classifier_dropout: 0.30
  alpha_init: 0.0

training:
  epochs: 80
  patience: 15
  loss: "cross_entropy"
  label_smoothing: 0.0
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  progress_interval: 100
  freeze_rgb_backbone_epochs: 0

baseline_checkpoint:
  best_checkpoint_dir: "outputs/tf_runs/convnext_base_ms1m_arcface_baseline/checkpoints/best"
  require: true

paths:
  output_dir: "outputs/smirk_geometry_cross_attention"
  logs_dir: "outputs/smirk_geometry_cross_attention/logs"
