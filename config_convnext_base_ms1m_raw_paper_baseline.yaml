seed:
  random_seed: 42

source:
  note: "Raw Paper Baseline: ConvNeXt-Base MS1M without Data Augmentation, without SAM, without Label Smoothing, standard AdamW optimizer for ablation comparison."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 32
  fallback_batch_size_per_gpu: 16
  require_two_gpus: false
  min_gpus: 1
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: false
  train_val_tta_hflip: false

tta:
  enabled: false
  hflip: false
  original_weight: 1.0
  flip_weight: 0.0

data:
  data_path: "data/fer13-split"
  mask_dir: null
  num_classes: 7
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: true
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 28709
  cache: false

augmentation:
  horizontal_flip: false
  rotation_degrees: 0.0
  brightness_delta: 0.0
  contrast_lower: 1.0
  contrast_upper: 1.0
  gamma_prob: 0.0
  gamma_min: 1.0
  gamma_max: 1.0
  random_erasing_prob: 0.0
  random_erasing_area_min: 0.0
  random_erasing_area_max: 0.0
  random_erasing_value: "random"

model:
  name: "convnext_base_ms1m_raw_paper_baseline"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "pretrained/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001

  checkpoint_path: null
  checkpoint_strict: false
  classifier_dropout1: 0.35
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0

  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0

  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true
  ablation: "cnn_only"

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 60
  patience: 15
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.0               # Raw cross-entropy (No label smoothing)
  optimizer: "adamw"                 # Standard AdamW (No SAM)
  base_optimizer: "adamw"
  sam_rho: 0.0                       # SAM disabled
  sam_adaptive: false
  lr: 0.0003
  finetune_lr: 0.0003
  visual_extractor_lr: 0.00003
  weight_decay: 0.035
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100

paths:
  output_dir: "outputs/papers/convnext_base_ms1m_raw_paper_baseline"
  logs_dir: "logs"
