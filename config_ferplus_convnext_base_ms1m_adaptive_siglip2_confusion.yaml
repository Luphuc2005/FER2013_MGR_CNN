seed:
  random_seed: 42

source:
  note: "FERPlus official 8-class majority protocol with ConvNeXt-Base MS1M, Adaptive Multi-Granularity SigLIP2 Semantic Alignment, and Confusion-Aware Hard Semantic Separation."

runtime:
  gpu_ids: [0]
  batch_size_per_gpu: 32
  fallback_batch_size_per_gpu: 32
  require_two_gpus: false
  min_gpus: 1
  allow_cpu_fallback: false
  memory_growth: true
  use_mixed_precision: true
  intra_op_threads: 16
  inter_op_threads: 4
  tf_data_num_parallel_calls: 4
  tf_data_private_threadpool_size: 4
  tf_data_deterministic: false
  prefetch_buffer: 2
  distributed_eval: false
  eval_tta_hflip: true
  train_val_tta_hflip: false

tta:
  enabled: true
  hflip: true
  original_weight: 0.50
  flip_weight: 0.50

data:
  dataset_type: "ferplus_majority8"
  data_path: "/home/ptbao/projects/FER2013_MGR_CNN/data/ferplus_official"
  train_csv: "/home/ptbao/projects/FER2013_MGR_CNN/data/ferplus_official/train_majority8.csv"
  val_csv: "/home/ptbao/projects/FER2013_MGR_CNN/data/ferplus_official/val_majority8.csv"
  test_csv: "/home/ptbao/projects/FER2013_MGR_CNN/data/ferplus_official/test_majority8.csv"
  image_root: "/home/ptbao/projects/FER2013_MGR_CNN/data/ferplus_official"
  mask_dir: null
  num_classes: 8
  class_names:
    - "Angry"
    - "Disgust"
    - "Fear"
    - "Happy"
    - "Sad"
    - "Surprise"
    - "Neutral"
    - "Contempt"
  expected_samples:
    train: 25045
    val: 3191
    test: 3137
  image_size: 112
  channels: 3
  normalize: true
  predecode_pixels: false
  preload_masks: false
  allow_missing_masks: true
  use_clean_filter: false
  bad_row_indices_path: null
  mask_ablation: "none"
  shuffle_buffer: 25045
  cache: false

augmentation:
  horizontal_flip: true
  rotation_degrees: 15.0
  brightness_delta: 0.15
  contrast_lower: 0.85
  contrast_upper: 1.15
  gamma_prob: 0.5
  gamma_min: 0.5
  gamma_max: 2.0
  random_erasing_prob: 0.40
  random_erasing_area_min: 0.02
  random_erasing_area_max: 0.15
  random_erasing_value: "random"

model:
  name: "ferplus_convnext_base_ms1m_adaptive_siglip2_confusion"
  arch: "convnext_base_ms1m_arcface"
  pretrained: true
  convnext_base_pretrained_path: "data/convnext_base_ms1m_arcface.pth"
  convnext_base_require_pretrained: true
  drop_path_rate: 0.1
  layer_scale_init_value: 0.000001

  use_semantic_branch: true
  use_clip_semantic: true
  multi_prototype: true
  ablation: "adaptive_clip_confusion"

  use_adaptive_granularity: true

  use_hard_semantic_loss: true
  lambda_sem: 0.1
  lambda_hard: 0.05
  hard_margin: 0.15
  hard_pairs:
    0: [4, 2]
    1: [7]
    2: [4, 0, 5]
    3: [7]
    4: [0, 2, 6]
    5: [2]
    6: [4, 7]
    7: [1, 3, 6]

  clip_model_name: "google/siglip2-base-patch16-224"
  clip_embedding_dim: 768
  clip_prototypes_path: "pretrained/siglip2_text_prototypes_8emotions_ferplus_multigranularity_multi5.npy"
  semantic_logit_scale: 20.0

  clip_semantic:
    enabled: true
    multi_prototype: true
    num_prototypes_per_class: 5
    use_adaptive_granularity: true
    use_hard_semantic_loss: true
    use_au_region_routed: true
    clip_model_name: "google/siglip2-base-patch16-224"
    clip_embedding_dim: 768
    clip_prototypes_path: "pretrained/siglip2_text_prototypes_8emotions_ferplus_multigranularity_multi5.npy"
    semantic_logit_scale: 20.0
    lambda_sem: 0.1
    lambda_hard: 0.05
    hard_margin: 0.15

  checkpoint_path: null
  checkpoint_strict: false
  classifier_dropout1: 0.35
  classifier_dropout2: 0.0
  ortho_loss_weight: 0.0

  use_cnn_aux_loss: false
  use_cnn_aux_logits: false
  cnn_aux_loss_weight: 0.0

  attention_logit_weight: 1.0
  cnn_aux_logit_weight: 0.0
  logit_fusion: "single_head"
  finetune_logit_fusion: "single_head"

  freeze_backbone_epochs: 4
  unfreeze_backbone: true
  freeze_unfrozen_batchnorm: true

stage_transition:
  enable_2stage_switching: false

training:
  epochs: 60
  patience: 15
  warmup_epochs: 5
  loss: "cross_entropy"
  label_smoothing: 0.10
  optimizer: "sam"
  base_optimizer: "adamw"
  sam_rho: 0.03
  sam_adaptive: false
  lr: 0.0003
  finetune_lr: 0.0003
  visual_extractor_lr: 0.00003
  weight_decay: 0.035
  scheduler: "cosine"
  grad_clip_norm: 1.0
  skip_nonfinite_batches: true
  monitor: "val_accuracy"
  resume: false
  best_checkpoint_start_epoch: 1
  periodic_checkpoint_interval: 10
  progress_interval: 100

paths:
  output_dir: "outputs/papers/ferplus_siglip2_confusion_majority8"
  logs_dir: "logs"
